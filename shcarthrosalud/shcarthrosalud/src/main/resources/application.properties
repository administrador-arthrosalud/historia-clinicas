spring.application.name=shcarthrosalud

# Conexión a PostgreSQL
# Los valores se leen de variables de entorno; lo que va después de ":" es el valor por defecto.
# DB_PASSWORD no tiene valor por defecto: defínela en tu IDE o en el servidor (nunca en este archivo).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_archivos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# "validate" comprueba al arrancar que las entidades coinciden con las tablas, pero no modifica nada.
# El esquema se crea con src/main/resources/db/schema-postgresql.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

server.error.include-message=always
